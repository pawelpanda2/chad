# Docker Compose — QNAP SHARED services: PostgreSQL (CHAD) + MongoDB
# (Beeper only). Used by BOTH docker-compose.qnap.test.yml and
# docker-compose.qnap.prod.yml (their dashboard containers reach these by
# container_name over the external "chad-shared" network, not by compose
# service name — service names only resolve within the SAME compose
# project). Started/stopped independently by
# bash-scripts/dashboard/00_qnap_shared/*.sh — never by the test/prod
# dashboard scripts. Env file: .env.qnap.
#
# Runtime na QNAP to WYŁĄCZNIE docker-compose (bez tmuxinator).
#
# 2026-07-29 — QNAP_CONTAINER_DATA_PATH (set in .env.qnap, not here) moved
# to /share/cp_1/chad-data — the actual real Shared Folder cp_1 (same
# physical volume, cachedev1, as the previous /share/ContainerData path; not
# a volume move, a directory-tree move requested explicitly). Real live
# paths are now /share/cp_1/chad-data/chad-shared/{postgres,beeper-mongodb}/
# {db,configdb,backups}. Old data at
# /share/CACHEDEV1_DATA/ContainerData/chad-shared/{postgres,beeper-mongodb}
# kept as a read-only rollback copy (chmod a-w'd, not deleted) — see
# tests/release-audit-report.md for the migration record (pre/post counts,
# checksums). This compose file itself needed no change — it already reads
# the path from ${QNAP_CONTAINER_DATA_PATH}, only .env.qnap's value changed.
#
# 2026-07-27 — CHAD Mongo runtime fully removed (see
# ../chad-docs/ai-docs/databases/red-rules.md): the old `chad-mongodb` replica-set
# service (+ its `mongo-keyfile-init`/`mongo-rs-init` helpers), which used
# to hold cp_items/cp_history for CHAD, is gone. PostgreSQL (below) is now
# CHAD's ONLY datastore — no fallback, no dual-write, no Dev Panel option to
# pick Mongo for CHAD data. `beeper-mongodb` is untouched and is now the
# only active MongoDB in this stack, used exclusively by Beeper CRM
# (`beeper_<repoGuid>` databases). See git history (pre-2026-07-27) for the
# removed `chad-mongodb`/`mongo-keyfile-init`/`mongo-rs-init` service
# definitions and `../chad-docs/ai-docs/deploy/2026-07-22_mongodb-chad-beeper-split.md`
# for the (now superseded) two-Mongo-instance history.
#
# beeper-mongodb: every beeper_<repoGuid> database. Standalone —
# deliberately NO replica set, NO Change Streams, ever (explicit user
# decision) — durability via periodic mongodump instead.
#
# Dane MongoDB Beepera MUSZĄ być na trwałym bind mouncie QNAP
# ($QNAP_CONTAINER_DATA_PATH/chad-shared/beeper-mongodb/db). docker compose
# down (bez -v) nigdy nie usuwa tych danych — usuwa je tylko skasowanie
# katalogu na hoście.
#
# Backup logiczny (bash-scripts/mongo/backup.sh, parameterized by
# MONGO_CONTAINER_NAME):
#   MONGO_CONTAINER_NAME=beeper-mongodb \
#     MONGO_ROOT_USERNAME="$BEEPER_MONGO_ROOT_USERNAME" MONGO_ROOT_PASSWORD="$BEEPER_MONGO_ROOT_PASSWORD" \
#     bash bash-scripts/mongo/backup.sh
#
# Content Provider (content-provider-api) removed from this stack — the
# .NET adapter code (`NetFileCpProvider`) is untouched; this was a
# deployment-only change (see git history if the service block is needed
# again). The reusable Mongo CP provider (`packages/dba/src/data-providers/
# mongo-cp-provider.ts`) is also untouched — CHAD's own compose simply never
# enables it (`DBA_MONGO_ENABLED=false`, see
# docker-compose.server1.test-prod.dashboard.yml) — another project can
# still configure it against its own Mongo.
#
# postgres (Story 80, added 2026-07-23; Story "Postgres cutover"
# 2026-07-27): CHAD's own PostgreSQL datastore (cp_items/cp_history/
# cp_outbox_*) — the SOLE primary for both TEST and PROD (same shared data).
# Lives here (the SHARED compose file), not in docker-compose.qnap.{test,
# prod}.yml, because it's one shared instance for both environments.
services:
  # Every beeper_<repoGuid> database (Story 73/76). Standalone — NO
  # --replSet, NO keyfile, NO Change Streams, ever. This was an explicit
  # user decision (not a default/oversight) accepting the one named
  # tradeoff: beeper-crm.ts's live-update SSE endpoint degrades from
  # instant (change-stream push) to 5s polling — already implemented as
  # poll-only in beeper-crm.ts, so this container never needs to satisfy a
  # change-stream consumer. Durability comes from periodic mongodump
  # instead (bash-scripts/mongo/backup.sh, this file's own header comment).
  # Own credentials (least privilege).
  beeper-mongodb:
    image: mongo:4.4
    container_name: beeper-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    # Host port 12041 published (QNAP port convention: 12020-29 TEST,
    # 12030-39 PROD, 12040+ shared-service diagnostic ports). Reachable over
    # Tailscale: mongodb://<user>:<pass>@100.117.139.83:12041/?authSource=admin
    # (no directConnection=true needed — standalone, no replica-set
    # topology to discover).
    ports:
      - "12041:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${BEEPER_MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${BEEPER_MONGO_ROOT_PASSWORD}"
    volumes:
      - "${QNAP_CONTAINER_DATA_PATH:-/share/ContainerData}/chad-shared/beeper-mongodb/db:/data/db"
      - "${QNAP_CONTAINER_DATA_PATH:-/share/ContainerData}/chad-shared/beeper-mongodb/configdb:/data/configdb"
      - "${QNAP_CONTAINER_DATA_PATH:-/share/ContainerData}/chad-shared/beeper-mongodb/backups:/backups"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # "mongo" (legacy shell), not "mongosh" — mongo:4.4 doesn't bundle mongosh.
      test:
        [
          "CMD",
          "mongo",
          "--quiet",
          "--eval",
          "db.adminCommand({ ping: 1 })",
          "-u",
          "${BEEPER_MONGO_ROOT_USERNAME}",
          "-p",
          "${BEEPER_MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # PostgreSQL 17 — CHAD's sole datastore. See file-header comment above.
  # Separate credentials from beeper-mongodb (least privilege), own
  # persistent bind mount, never touches beeper-mongodb's data/volumes.
  postgres:
    image: postgres:17
    container_name: chad-postgres
    restart: unless-stopped
    # Host port 12042 published over Tailscale — next free diagnostic slot
    # past beeper-mongodb's 12041 (QNAP port convention: 12020-29 TEST,
    # 12030-39 PROD, 12040+ shared-service diagnostic ports).
    ports:
      - "12042:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-chad}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-chad}"
    volumes:
      - "${QNAP_CONTAINER_DATA_PATH:-/share/ContainerData}/chad-shared/postgres/db:/var/lib/postgresql/data"
      - "${QNAP_CONTAINER_DATA_PATH:-/share/ContainerData}/chad-shared/postgres/backups:/backups"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chad} -d ${POSTGRES_DB:-chad}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # history-worker (Story 74/78's Change-Stream consumer -> cp_history) is
  # retired as of Story 79 — cp_history is now written transactionally by
  # the Dashboard's own dba layer (executeCpMutationWithHistory). Since the
  # 2026-07-27 Postgres cutover, this applies to the Postgres write path
  # (executeCpMutationWithHistoryPostgres) — no Mongo/Change-Streams
  # involvement in CHAD history at all anymore. See
  # ../chad-docs/ai-docs/history/how-it-works.md.

networks:
  default:
    name: chad-shared
    external: true
