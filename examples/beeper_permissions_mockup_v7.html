<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beeper Permissions Mockup</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #dedede;
      --text: #181818;
      --muted: #777;
      --row: #ffffff;
      --row-hover: #f4f4f4;
      --selected: #f1f1f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 10px 24px 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn {
      height: 38px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin-left: 4px;
    }

    .frame {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 88px 92px 90px 1fr;
      align-items: center;
      column-gap: 0;
      row-gap: 0;
      margin-bottom: 14px;
    }

    .select,
    .search {
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      padding: 0 12px;
      font-size: 14px;
    }

    .toolbar > .select:first-child {
      width: 88px;
      padding-left: 8px;
      padding-right: 6px;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    .filter-select {
      width: 92px;
      padding-left: 8px;
      padding-right: 6px;
      border-radius: 0;
      border-left: 0;
    }

    .search-wrap {
      position: relative;
    }

    .search {
      width: 90px;
      padding-left: 30px;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: 0;
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
    }

    .count {
      justify-self: end;
      color: var(--muted);
      font-size: 14px;
      padding-right: 4px;
    }

    .list {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      background: #fff;
    }

    .header-row,
    .contact-row {
      display: grid;
      grid-template-columns: 84px 84px minmax(0, 1fr);
      align-items: center;
    }

    .header-row {
      min-height: 42px;
      padding: 0 14px;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header-row > div:nth-child(1),
    .header-row > div:nth-child(2) {
      text-align: center;
    }

    .header-row > div:nth-child(3) {
      text-align: left;
    }

    .contact-row {
      min-height: 64px;
      padding: 0 14px;
      background: var(--row);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .contact-row:last-child {
      margin-bottom: 0;
    }

    .contact-row:hover {
      background: var(--row-hover);
    }

    .contact-row.selected {
      background: var(--selected);
      border-color: #d5d5d5;
    }

    .contact-main {
      display: block;
      min-width: 0;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .check-cell {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .count {
        justify-self: start;
      }

      .header-row,
      .contact-row {
        grid-template-columns: 72px 72px minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <button class="btn">‹</button>
      <button class="btn">↶ Back</button>
      <button class="btn">Forw →</button>
      <div class="title">Beeper</div>
    </div>

    <div class="frame">
      <div class="toolbar">
        <select class="select">
          <option selected>Permissions</option>
          <option>All</option>
          <option>Business</option>
          <option>Romantic</option>
          <option>Friends</option>
        </select>

        <select class="select filter-select" id="permissionFilter">
          <option value="all" selected>All</option>
          <option value="include">Include</option>
          <option value="exclude">Exclude</option>
          <option value="permission">Permission</option>
        </select>

        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search" placeholder="Search" />
        </div>

        <div class="count">103 contacts</div>
      </div>

      <div class="list">
        <div class="header-row">
          <div>Include</div>
          <div>Exclude</div>
          <div>Contact</div>
        </div>

        <div class="contact-row selected" data-include="true" data-exclude="false">
          <div class="check-cell"><input type="checkbox" checked /></div>
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="contact-main">
            <div>
              <div class="name">Sprzątanie Agnieszka</div>
            </div>
          </div>
        </div>

        <div class="contact-row" data-include="false" data-exclude="true">
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="check-cell"><input type="checkbox" checked /></div>
          <div class="contact-main">
            <div>
              <div class="name">Karolina</div>
            </div>
          </div>
        </div>

        <div class="contact-row" data-include="false" data-exclude="false">
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="contact-main">
            <div>
              <div class="name">JanuPol</div>
            </div>
          </div>
        </div>

        <div class="contact-row" data-include="true" data-exclude="false">
          <div class="check-cell"><input type="checkbox" checked /></div>
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="contact-main">
            <div>
              <div class="name">Greg</div>
            </div>
          </div>
        </div>

        <div class="contact-row" data-include="false" data-exclude="false">
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="contact-main">
            <div>
              <div class="name">master Poland</div>
            </div>
          </div>
        </div>

        <div class="contact-row" data-include="false" data-exclude="true">
          <div class="check-cell"><input type="checkbox" /></div>
          <div class="check-cell"><input type="checkbox" checked /></div>
          <div class="contact-main">
            <div>
              <div class="name">Floris</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const permissionFilter = document.getElementById("permissionFilter");
    const rows = Array.from(document.querySelectorAll(".contact-row"));

    function syncRowState(row) {
      const checkboxes = row.querySelectorAll('input[type="checkbox"]');
      const include = checkboxes[0];
      const exclude = checkboxes[1];

      row.dataset.include = include.checked ? "true" : "false";
      row.dataset.exclude = exclude.checked ? "true" : "false";
    }

    function applyPermissionFilter() {
      const filter = permissionFilter.value;

      rows.forEach((row) => {
        const include = row.dataset.include === "true";
        const exclude = row.dataset.exclude === "true";

        let visible = true;

        if (filter === "include") {
          visible = include;
        } else if (filter === "exclude") {
          visible = exclude;
        } else if (filter === "permission") {
          visible = include && !exclude;
        }

        row.style.display = visible ? "grid" : "none";
      });
    }

    rows.forEach((row) => {
      const checkboxes = row.querySelectorAll('input[type="checkbox"]');
      const include = checkboxes[0];
      const exclude = checkboxes[1];

      include.addEventListener("change", () => {
        if (include.checked) exclude.checked = false;
        syncRowState(row);
        applyPermissionFilter();
      });

      exclude.addEventListener("change", () => {
        if (exclude.checked) include.checked = false;
        syncRowState(row);
        applyPermissionFilter();
      });

      syncRowState(row);
    });

    permissionFilter.addEventListener("change", applyPermissionFilter);
    applyPermissionFilter();
  </script>
</body>
</html>
